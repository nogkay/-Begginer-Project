<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTG Style | Home</title>
    <link rel="stylesheet" href="../CSS/page01.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">MTG STYLE</div>
        <nav class="menu">
            <a href="#">Coleções</a>
            <a href="#">Sobre</a>
            <a href="#">Contato</a>
        </nav>
    </header>

    <main class="hero-container">
        
        <section class="hero-texto">
            <h1>O drop que redefine o seu estilo urbano.</h1>
            <p>Peças exclusivas com corte oversized, conforto extremo e a atitude das ruas. Garanta seu acesso antecipado ao próximo lançamento.</p>
        </section>

        <section class="hero-form-box">
            <h2>Faça parte do Club</h2>
            <p>Cadastre-se para receber cupom de boas-vindas e avisos de drops.</p>
            
            <form class="newsletter-form">
                <div class="input-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" placeholder="Digite seu nome...">
                </div>

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com">
                </div>

                <button type="submit" class="btn-enviar">Garantir Acesso</button>
            </form>
        </section>

    </main>

</body>
</html>
