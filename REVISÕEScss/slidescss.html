<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTG Style - Estratégia de Marca</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* 1. RESET E VARIAVEIS */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --cor-fundo: #050505;
            --cor-neon: #1db61d;
            --cor-texto: #f5f5f5;
            --cor-card: #111111;
        }

        body {
            font-family: 'Urbanist', sans-serif;
            background-color: var(--cor-fundo);
            color: var(--cor-texto);
            overflow-x: hidden;
        }

        /* 2. ESTRUTURA DOS SLIDES */
        section {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px;
            position: relative;
            border-bottom: 1px solid #222;
        }

        /* O brilho neon no fundo */
        section::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 20%, rgba(29, 182, 29, 0.1) 0%, transparent 40%);
            z-index: 0;
        }

        .conteudo {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1100px;
        }

        /* 3. TIPOGRAFIA */
        h1 {
            font-size: 80px;
            font-weight: 900;
            text-transform: uppercase;
            text-align: center;
            line-height: 0.9;
        }

        h1 span {
            color: var(--cor-neon);
            text-shadow: 0 0 20px rgba(29, 182, 29, 0.4);
        }

        h2 {
            font-size: 48px;
            margin-bottom: 30px;
        }

        p {
            font-size: 20px;
            color: #aaa;
            max-width: 700px;
        }

        /* 4. GRID DE CARDS (O Slide 5 que você curtiu) */
        .grid-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            margin-top: 40px;
        }

        .card {
            background: var(--cor-card);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #222;
            transition: 0.3s;
        }

        .card:hover {
            border-color: var(--cor-neon);
            transform: translateY(-10px);
        }

        .card i {
            font-size: 40px;
            color: var(--cor-neon);
            margin-bottom: 20px;
        }

        /* 5. ESTILO DO BOTÃO (CTA) */
        .btn-neon {
            margin-top: 30px;
            padding: 15px 40px;
            background-color: var(--cor-neon);
            color: rgb(255, 0, 0);
            text-decoration: none;
            font-weight: 700;
            border-radius: 50px;
            text-transform: uppercase;
            display: inline-block;
            transition: 0.3s;
        }

        .btn-neon:hover {
            box-shadow: 0 0 30px var(--cor-neon);
        }
    </style>
</head>
<body>

    <section>
        <div class="conteudo" style="text-align: center;">
            <h1>MTG <span>STYLE</span></h1>
            <p style="margin: 20px auto;">A arquitetura de conversão aplicada ao streetwear do Eusébio.</p>
            <a href="#proximo" class="btn-neon">Ver Estratégia</a>
        </div>
    </section>

    <section id="proximo">
        <div class="conteudo">
            <h2>Pilares da <span>Marca</span></h2>
            <div class="grid-cards">
                <div class="card">
                    <i class="fa-solid fa-gem"></i>
                    <h3>Qualidade</h3>
                    <p>Tecido premium e corte oversized real.</p>
                </div>
                <div class="card">
                    <i class="fa-solid fa-location-dot"></i>
                    <h3>Localismo</h3>
                    <p>Feito no Eusébio, para quem vive a rua.</p>
                </div>
                <div class="card">
                    <i class="fa-solid fa-bolt"></i>
                    <h3>Exclusividade</h3>
                    <p>Drops limitados que geram desejo.</p>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
