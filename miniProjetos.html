   <!DOCTYPE html>
  <html lang="PT-BR">
    <head>
        <meta charset="UTF-8">
        <title>Mini Projetos Meus</title>
        <link rel="stylesheet">
        </head>
        <body>
            <script>
                   /* ===================== BANCO DE DADOS DO SISTEMA ============= */

const categoria = ["Pena","Galo","Leve Pesado","Meio Pesado"];
const pesosMinimos = [50, 60, 75,85];
const pesosMaximos = [59, 74, 84 ,85];
const idades = [16,17,18,19,20];
const verificarPagamento = ["Cartão de Crédito","Boleto","Pix"];

/* ================ FUNÇÕES DO SISTEMA DE CLASSFICAÇÃO DE LUTA ================= */

function baterPeso(){
   let pedirPeso = Number(window.prompt("Digite o peso do lutador:"));
   let encontrouCategoria = false;
   for(let i = 0; i < pesosMinimos.length; i++){
    if(pedirPeso >= pesosMinimos[i] && pedirPeso <= pesosMaximos[i]){
        console.log(`O lutador se encaixa na categoria ${categoria[i]}`);
        encontrouCategoria = true;
        break;
    }
   }
   if(!encontrouCategoria){
    console.log("Peso do lutador não corresponde a nenhuma categoria");
   }
}

function verificarIdade(){
    let pedirIdade = Number(window.prompt("Digite a idade do Lutador:"))
    let achouIdade = false;
    for(let i = 0;i < idades.length; i++){
        if(pedirIdade === idades[i]){
            console.log(`O lutador tem a idade de ${idades[i]} anos`);
            achouIdade = true;
            break;
        }
    }
    if(!achouIdade){
        console.log("Idade do lutador não corresponde a nenhuma categoria");
    }
}
    function pagamento(){
      let valordaLuta = 100;
        let formaDePagamento = window.prompt("Escolha a forma de pagamento: Digite 0 para Cartão de Crédito, 1 para Boleto ou 2 para Pix:");
        let encontrouForma = false;
        for(let i = 0; i < verificarPagamento.length; i++){
            if(formaDePagamento == i.toString()){
                console.log(`O valor da luta é R$${valordaLuta} e a forma de pagamento escolhida foi ${verificarPagamento[i]}`);
                encontrouForma = true;
                break;
            }


        }
        if(!encontrouForma){
            console.log("Forma de pagamento inválida. Por favor, escolha Cartão de Crédito, Boleto ou Pix.");
        }

    }
/* ===================== EXECUÇÃO DO FLUXO ============ */
function iniciarSistema(){
    console.log("Bem-vindo ao sistema de classificação de luta!");
    baterPeso();
    verificarIdade();
    pagamento();
}
iniciarSistema();
            </script>
        </body>
  </html>
